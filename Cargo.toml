[package]
name = "easy-docker"
version = "0.1.0"
edition = "2024"

[dependencies]
bollard = "*"
color-eyre = "0.6.5"
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = "0.3"
ratatui = "0.30.2"
tokio = {version = "1.53.1", features = ["full"]}

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
