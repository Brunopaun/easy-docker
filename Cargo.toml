[package]
name = "easy-docker"
version = "0.1.8"
edition = "2024"
authors = ["Bruno Passos <brunopaun0@gmail.com>"]
description = "A fast, lightweight, and modern TUI for managing Docker containers, images, volumes, and networks built in Rust."
readme = "README.md"
repository = "https://github.com/Brunopaun/easy-docker"
homepage = "https://github.com/Brunopaun/easy-docker"
license = "MIT"
keywords = ["docker", "tui", "ratatui", "container", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
bollard = "0.21"
color-eyre = "0.6.5"
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = "0.3"
ratatui = "0.30.2"
tokio = {version = "1.53.1", features = ["full"]}

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
